<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XEVORAS — Offline Connection</title>
  <meta name="theme-color" content="#0b0a09">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0b0a09;
      color: #faf7f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 40px 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      background: #17140f;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 14px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 8px;
      background: #0b0a09;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #faf7f2;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .sub {
      color: #d4af37;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      margin-bottom: 16px;
    }
    p {
      color: #9c9489;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    button {
      background: linear-gradient(135deg, #d4af37, #aa8010);
      color: #0b0a09;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
      transition: transform 0.2s;
    }
    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/brand/logo.png" alt="XEVORAS" class="logo">
    <h1>XEVORAS ATELIER</h1>
    <div class="sub">ALWAYS RARE · हटके हमेशा</div>
    <p>You appear to be offline. Reconnect to cellular data or Wi-Fi to explore our latest luxury garments and 3D Avatar fittings.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
